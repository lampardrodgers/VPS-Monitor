[project]
name = "vps-monitor-agent"
version = "0.1.0"
description = "Lightweight VPSMonitor node agent for Linux VPS hosts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
vpsmon-agent = "bandwidth_monitor_agent.cli:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
