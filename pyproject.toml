[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vpsmonitor"
version = "0.3.0"
description = "Provider API collectors for a unified VPS inventory and metrics store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alibabacloud-swas-open20200601>=2.0.0",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.32,<1",
]

[project.scripts]
vpsmonitor = "vpsmonitor.cli:main"
vpsmonitor-api = "vpsmonitor.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vpsmonitor"]
